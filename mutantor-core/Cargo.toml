[package]
name = "mutantor-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Core functionality for mutantor"
repository = "https://github.com/Mahdi-Movahedian-Atar/mutantor"
readme = "../readme.md"
keywords = ["mutation-testing", "testing"]
categories = ["development-tools::testing"]


[dependencies]
syn = { version = "2", features = ["full", "visit-mut", "visit"] }
quote = "1"
proc-macro2 = "1"
rand = "0.10.1"